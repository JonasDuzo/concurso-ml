<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Simulado ML</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#64708a;--pr:#2748c9;--prt:#fff;--ok:#16a34a;--okb:#dcfce7;--er:#dc2626;--erb:#fee2e2;--bd:#d9dfec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2133;--tx:#e8ecf6;--mu:#93a0bd;--pr:#6b8cff;--prt:#0b1020;--ok:#4ade80;--okb:#12301f;--er:#f87171;--erb:#3b1a1a;--bd:#2c3650}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2133;--tx:#e8ecf6;--mu:#93a0bd;--pr:#6b8cff;--prt:#0b1020;--ok:#4ade80;--okb:#12301f;--er:#f87171;--erb:#3b1a1a;--bd:#2c3650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:17px;margin:20px 0 8px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:12px;padding:12px 14px;font-weight:600;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn[disabled]{opacity:.4}
.mode{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left}
.mode b{display:block}.mode span{font-size:13px;color:var(--mu)}
.stat{text-align:center}.stat b{font-size:22px;display:block}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.opt.sel{border-color:var(--pr)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.er{border-color:var(--er);background:var(--erb)}
.q{font-size:18px;font-weight:600;margin:10px 0}
.tag{display:inline-block;font-size:12px;background:var(--bd);border-radius:20px;padding:2px 9px;color:var(--mu)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.fb{padding:10px;border-radius:10px;margin-top:8px;font-weight:600}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.er{background:var(--erb);color:var(--er)}
.link{background:none;border:0;color:var(--pr);padding:6px}
textarea{width:100%;height:90px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
</style></head><body><div id="app"></div>
<script>
const D={"q": [{"id": 0, "t": 0, "q": "Segundo a definição clássica de Tom Mitchell, um programa \"aprende\" quando:", "o": ["Seu desempenho em uma tarefa T, medido por P, melhora com a experiência E.", "Seu código-fonte é reescrito manualmente pelo programador.", "Ele armazena todos os dados de treino na memória.", "Ele executa regras fixas pré-programadas."], "a": 0}, {"id": 1, "t": 0, "q": "A principal diferença entre programação tradicional e aprendizagem de máquina é que, em ML:", "o": ["As regras são escritas manualmente pelo programador.", "O algoritmo descobre os padrões/regras a partir dos dados.", "Não há necessidade de dados.", "O desempenho nunca é avaliado."], "a": 1}, {"id": 2, "t": 0, "q": "Em um projeto de ML, o conjunto de teste serve para:", "o": ["Treinar o modelo.", "Ajustar os parâmetros do modelo.", "Avaliar o desempenho do modelo em dados não vistos.", "Coletar novos dados."], "a": 2}, {"id": 3, "t": 0, "q": "A capacidade de um modelo ter bom desempenho em dados novos, não vistos no treinamento, é chamada de:", "o": ["Overfitting", "Generalização", "Memorização", "Rotulagem"], "a": 1}, {"id": 4, "t": 0, "q": "Qual das alternativas é uma aplicação de aprendizagem de máquina?", "o": ["Escrever um programa que soma dois números.", "Um sistema de recomendação de filmes.", "Um editor de texto simples.", "Uma calculadora científica."], "a": 1}, {"id": 5, "t": 0, "q": "Na aprendizagem de máquina, as variáveis que descrevem cada exemplo/instância são chamadas de:", "o": ["Rótulos", "Atributos (features)", "Métricas", "Parâmetros fixos"], "a": 1}, {"id": 6, "t": 0, "q": "Aprendizagem de máquina é:", "o": ["O mesmo que Inteligência Artificial.", "Um subcampo da Inteligência Artificial.", "Uma linguagem de programação.", "Um tipo de banco de dados."], "a": 1}, {"id": 7, "t": 1, "q": "Na arquitetura de uma rede neural, o conhecimento aprendido fica armazenado principalmente em:", "o": ["Nas funções de ativação.", "Nos pesos e vieses das conexões.", "Nos dados de treinamento.", "Na camada de entrada."], "a": 1}, {"id": 8, "t": 1, "q": "O Perceptron de camada única não consegue resolver o problema do XOR porque:", "o": ["Ele exige dados rotulados.", "Ele só resolve problemas linearmente separáveis.", "Sua função de ativação é sempre linear.", "Ele não possui pesos."], "a": 1}, {"id": 9, "t": 1, "q": "A principal função de uma função de ativação não linear (como ReLU ou sigmoide) em uma rede neural é:", "o": ["Acelerar o processamento dos dados de entrada.", "Permitir que a rede aprenda padrões complexos e não lineares.", "Reduzir o número de camadas necessárias.", "Armazenar os dados de treinamento na memória."], "a": 1}, {"id": 10, "t": 1, "q": "No treinamento de uma rede neural, o algoritmo que propaga o erro da camada de saída de volta para as camadas anteriores, permitindo o ajuste dos pesos, é chamado de:", "o": ["Propagação direta (forward).", "Retropropagação (backpropagation).", "Dropout.", "Normalização."], "a": 1}, {"id": 11, "t": 1, "q": "Uma época no treinamento de uma rede neural corresponde a:", "o": ["Uma atualização de pesos usando um único exemplo.", "Uma passada completa pelo conjunto de treinamento.", "O ajuste de um único peso.", "A divisão dos dados em treino e teste."], "a": 1}, {"id": 12, "t": 1, "q": "Se a taxa de aprendizado (learning rate) for muito alta, é provável que:", "o": ["O treinamento fique mais lento, mas mais preciso.", "O modelo oscile ou não consiga convergir.", "A rede perca as camadas ocultas.", "O conjunto de dados precise ser reduzido."], "a": 1}, {"id": 13, "t": 1, "q": "Redes Convolucionais (CNNs) são especialmente indicadas para problemas de:", "o": ["Processamento de texto sequencial.", "Reconhecimento e classificação de imagens.", "Previsão de séries temporais longas.", "Apenas regressão linear."], "a": 1}, {"id": 14, "t": 1, "q": "A técnica de dropout em redes neurais serve principalmente para:", "o": ["Aumentar a velocidade do treinamento.", "Reduzir o overfitting, desligando neurônios aleatoriamente durante o treino.", "Substituir a função de ativação.", "Eliminar dados duplicados do conjunto de treino."], "a": 1}, {"id": 15, "t": 1, "q": "Em uma rede neural com ativação sigmoide na saída, o valor 0,9 gerado pelo neurônio de saída pode ser interpretado como:", "o": ["Uma alta probabilidade de pertencer à classe positiva.", "O número de camadas ocultas da rede.", "O valor do learning rate.", "Uma medida do erro de treinamento."], "a": 0}, {"id": 16, "t": 1, "q": "Qual das alternativas descreve corretamente a relação entre Deep Learning e redes neurais?", "o": ["Deep Learning é uma técnica que dispensa redes neurais.", "Deep Learning refere-se a redes neurais com muitas camadas ocultas (profundas).", "Deep Learning é outra denominação do Perceptron simples.", "Deep Learning é um tipo de banco de dados para treinamento."], "a": 1}, {"id": 17, "t": 2, "q": "No Teorema de Bayes, P(H|E) = P(E|H) × P(H) / P(E), o termo P(H) é chamado de:", "o": ["Probabilidade a posteriori.", "Probabilidade a priori.", "Verossimilhança.", "Evidência."], "a": 1}, {"id": 18, "t": 2, "q": "No exemplo do teste médico (doença em 1% da população, sensibilidade 90%, falso positivo 5%), a probabilidade de uma pessoa estar doente dado que testou positivo é aproximadamente:", "o": ["90%", "50%", "15,4%", "5%"], "a": 2}, {"id": 19, "t": 2, "q": "A \"suposição ingênua\" do classificador Naive Bayes afirma que:", "o": ["Os atributos são independentes entre si (independentes uns dos outros, sem qualquer condicionamento).", "Os atributos são condicionalmente independentes dado a classe.", "As classes são independentes dos dados.", "A distribuição dos dados é sempre normal."], "a": 1}, {"id": 20, "t": 2, "q": "Em uma classificação de textos com contagem de palavras, a variante mais adequada do Naive Bayes é:", "o": ["Gaussiana.", "Bernoulli.", "Multinomial.", "Degrau."], "a": 2}, {"id": 21, "t": 2, "q": "A suavização de Laplace no Naive Bayes tem como principal objetivo:", "o": ["Acelerar o treinamento.", "Evitar que probabilidades iguais a zero anulem o produto de verossimilhanças.", "Transformar dados contínuos em discretos.", "Garantir que a priori seja sempre 0,5."], "a": 1}, {"id": 22, "t": 2, "q": "Se duas variáveis A e B são independentes, então:", "o": ["P(A∩B) = P(A) + P(B)", "P(A∩B) = P(A) × P(B)", "P(A|B) = 0", "P(A|B) = P(B|A) sempre."], "a": 1}, {"id": 23, "t": 2, "q": "No Naive Bayes, a regra de decisão de escolher a classe com maior probabilidade a posteriori é conhecida como:", "o": ["Máxima verossimilhança (MLE).", "Máximo a posteriori (MAP).", "Gradiente descendente.", "Retropropagação."], "a": 1}, {"id": 24, "t": 2, "q": "A Estimação de Máxima Verossimilhança (MLE) consiste em:", "o": ["Escolher os parâmetros que tornam os dados observados mais prováveis.", "Escolher a classe com menor variância.", "Minimizar o número de atributos.", "Calcular a média aritmética dos rótulos."], "a": 0}, {"id": 25, "t": 2, "q": "Apesar de a suposição de independência raramente ser verdadeira na prática, o Naive Bayes costuma funcionar bem porque:", "o": ["Ele usa redes neurais profundas para corrigir o problema.", "Para decisão de classe, muitas vezes os erros de estimativa se compensam e a classe correta ainda recebe a maior probabilidade.", "Ele elimina todos os atributos correlacionados automaticamente.", "Ele não depende dos dados de treinamento."], "a": 1}, {"id": 26, "t": 2, "q": "Em um sistema de ML, um método probabilístico como o Naive Bayes ou a regressão logística é vantajoso em relação a um método que retorna apenas o rótulo porque:", "o": ["Sempre obtém acurácia 100%.", "Produz uma medida de confiança (probabilidade) associada à previsão.", "Não precisa de dados rotulados.", "Dispensa a avaliação de desempenho."], "a": 1}, {"id": 27, "t": 3, "q": "A principal diferença entre aprendizado supervisionado e não supervisionado é:", "o": ["O tamanho do conjunto de dados.", "A presença ou ausência de rótulos nos dados de treino.", "O tipo de linguagem de programação usada.", "A velocidade de processamento."], "a": 1}, {"id": 28, "t": 3, "q": "Prever o preço de uma casa a partir de suas características é um problema de:", "o": ["Classificação.", "Regressão.", "Clusterização.", "Associação."], "a": 1}, {"id": 29, "t": 3, "q": "Classificar um e-mail como spam ou não spam é um problema de:", "o": ["Regressão.", "Clusterização.", "Classificação.", "Redução de dimensionalidade."], "a": 2}, {"id": 30, "t": 3, "q": "Agrupar clientes com comportamentos de compra semelhantes, sem usar rótulos pré-definidos, é um exemplo de:", "o": ["Aprendizado supervisionado.", "Aprendizado não supervisionado (clusterização).", "Aprendizado por reforço.", "Regressão linear."], "a": 1}, {"id": 31, "t": 3, "q": "No aprendizado por reforço, o agente aprende:", "o": ["A partir de um grande conjunto de dados rotulados.", "Interagindo com o ambiente e recebendo recompensas/punições.", "Copiando o comportamento de outros modelos.", "Sem nunca receber feedback."], "a": 1}, {"id": 32, "t": 3, "q": "O aprendizado semi-supervisionado é caracterizado por:", "o": ["Usar apenas dados rotulados.", "Usar apenas dados não rotulados.", "Combinar poucos dados rotulados com muitos dados não rotulados.", "Não usar dados de nenhum tipo."], "a": 2}, {"id": 33, "t": 3, "q": "Em uma classificação binária, o número de classes possíveis é:", "o": ["1", "2", "3", "Ilimitado"], "a": 1}, {"id": 34, "t": 3, "q": "A redução de dimensionalidade (ex.: PCA) é uma tarefa tipicamente:", "o": ["Supervisionada.", "Não supervisionada.", "Por reforço.", "Semi-supervisionada."], "a": 1}, {"id": 35, "t": 3, "q": "Um sistema que descobre \"clientes que compram o produto A também tendem a comprar o produto B\" está realizando:", "o": ["Regressão.", "Classificação.", "Mineração de regras de associação.", "Aprendizado por reforço."], "a": 2}, {"id": 36, "t": 3, "q": "Um robô que aprende a andar testando movimentos e recebendo recompensas por avançar está usando:", "o": ["Aprendizado supervisionado.", "Aprendizado não supervisionado.", "Aprendizado por reforço.", "Clusterização."], "a": 2}, {"id": 37, "t": 4, "q": "Um sistema que reconhece rostos em fotografias é uma aplicação típica de:", "o": ["Processamento de linguagem natural.", "Visão computacional.", "Sistemas de recomendação.", "Regras de associação."], "a": 1}, {"id": 38, "t": 4, "q": "Um chatbot que responde perguntas em texto é uma aplicação de:", "o": ["Visão computacional.", "Processamento de linguagem natural (PLN).", "Veículos autônomos.", "Clusterização."], "a": 1}, {"id": 39, "t": 4, "q": "A filtragem colaborativa recomenda itens com base em:", "o": ["Características dos próprios itens.", "O comportamento/avaliações de usuários semelhantes.", "Regras fixas escritas pelo programador.", "Apenas na ordem alfabética dos itens."], "a": 1}, {"id": 40, "t": 4, "q": "A filtragem baseada em conteúdo recomenda itens com base em:", "o": ["O comportamento de usuários semelhantes.", "As características dos itens que o usuário já gostou.", "Sorteio aleatório.", "Apenas no preço dos itens."], "a": 1}, {"id": 41, "t": 4, "q": "Um sistema que detecta transações bancárias suspeitas é uma aplicação de:", "o": ["Detecção de anomalias/fraude.", "Geração de conteúdo.", "Tradução automática.", "Reconhecimento de fala."], "a": 0}, {"id": 42, "t": 4, "q": "Um carro autônomo que decide como dirigir testando ações e recebendo recompensas usa, predominantemente:", "o": ["Aprendizado supervisionado.", "Aprendizado por reforço.", "Clusterização.", "Regras de associação."], "a": 1}, {"id": 43, "t": 4, "q": "Prever a demanda futura de um produto para planejar o estoque é uma aplicação de:", "o": ["Visão computacional.", "Previsão / séries temporais.", "Filtragem colaborativa.", "Reconhecimento de fala."], "a": 1}, {"id": 44, "t": 4, "q": "Um sistema que agrupa clientes com perfis de compra semelhantes para campanhas de marketing é uma aplicação de:", "o": ["Regressão.", "Clusterização (segmentação).", "Filtragem baseada em conteúdo.", "Aprendizado por reforço."], "a": 1}, {"id": 45, "t": 4, "q": "A detecção de spam em e-mails é, do ponto de vista da tarefa de ML, um problema de:", "o": ["Regressão.", "Classificação (supervisionado).", "Clusterização.", "Redução de dimensionalidade."], "a": 1}, {"id": 46, "t": 4, "q": "A maioria dos sistemas de recomendação reais (como Netflix e Amazon) combina múltiplas técnicas, sendo chamados de sistemas:", "o": ["Simples.", "Híbridos.", "Estáticos.", "Lineares."], "a": 1}, {"id": 47, "t": 5, "q": "Viés indutivo em aprendizagem de máquina pode ser definido como:", "o": ["A velocidade de treinamento do algoritmo.", "O conjunto de suposições que o algoritmo faz para generalizar além dos dados de treino.", "O número de atributos do conjunto de dados.", "O erro do modelo nos dados de treino."], "a": 1}, {"id": 48, "t": 5, "q": "Sem viés indutivo, um algoritmo de aprendizado:", "o": ["Dispensa dados de treinamento.", "Treina mais rápido.", "Não consegue generalizar — no máximo decoraria os dados de treino, pois há infinitas funções compatíveis com eles.", "Sempre encontra a função perfeita."], "a": 2}, {"id": 49, "t": 5, "q": "Uma árvore de decisão que prefere árvores menores entre várias árvores consistentes com os dados está aplicando qual tipo de viés?", "o": ["Viés de medição.", "Viés de preferência.", "Viés de amostragem.", "Viés de linguagem (restrição)."], "a": 1}, {"id": 50, "t": 5, "q": "O viés da regressão linear é:", "o": ["Que as classes são equilibradas.", "Que não há ruído nos dados.", "Que a relação entre entrada e saída é linear.", "Que os dados são independentes."], "a": 2}, {"id": 51, "t": 5, "q": "O Teorema No Free Lunch afirma que:", "o": ["É proibido usar algoritmos não supervisionados.", "O melhor algoritmo é sempre a rede neural profunda.", "Nenhum algoritmo é superior a todos os outros em todos os problemas possíveis — cada viés favorece certos problemas.", "Todos os algoritmos têm o mesmo desempenho em todos os problemas."], "a": 2}, {"id": 52, "t": 5, "q": "Quando um modelo com viés muito forte (simples demais) não consegue aprender nem o padrão do treino, temos:", "o": ["Generalização perfeita.", "Ruído zero.", "Underfitting.", "Overfitting."], "a": 2}, {"id": 53, "t": 5, "q": "A Navalha de Occam, amplamente usada como viés de preferência, recomenda:", "o": ["Usar todos os atributos disponíveis.", "Treinar por mais épocas.", "Preferir, entre hipóteses igualmente consistentes com os dados, a mais simples.", "Escolher sempre o modelo mais complexo."], "a": 2}, {"id": 54, "t": 5, "q": "O viés de preferência difere do viés de linguagem porque:", "o": ["São a mesma coisa.", "O viés de preferência ordena/prioriza algumas hipóteses dentro do espaço, enquanto o de linguagem restringe quais hipóteses o algoritmo pode representar.", "O viés de linguagem só existe em redes neurais.", "Não influencia a generalização."], "a": 1}, {"id": 55, "t": 5, "q": "No tradeoff viés-variância, o erro total de um modelo pode ser decomposto em:", "o": ["Acurácia + precisão.", "Erro sistemático + erro aleatório apenas.", "Viés² + variância + ruído.", "Erro de treino + erro de teste."], "a": 2}, {"id": 56, "t": 5, "q": "Um modelo polinomial de grau muito alto, que passa por todos os pontos do treino mas falha em dados novos, ilustra:", "o": ["Ausência de ruído.", "Viés fraco demais (overfitting).", "Viés de linguagem bem calibrado.", "Viés forte demais (underfitting)."], "a": 1}, {"id": 57, "t": 6, "q": "A aprendizagem descritiva tem como objetivo principal:", "o": ["Prever valores futuros com alta acurácia.", "Descrever e compreender os padrões e a estrutura dos dados.", "Rotular automaticamente todos os exemplos.", "Minimizar o erro quadrático médio."], "a": 1}, {"id": 58, "t": 6, "q": "A aprendizagem preditiva se caracteriza por:", "o": ["Não usar rótulos em nenhuma etapa.", "Descobrir grupos em dados sem resposta.", "Estimar valores ou categorias desconhecidas a partir de atributos conhecidos.", "Gerar regras de associação."], "a": 2}, {"id": 59, "t": 6, "q": "O algoritmo K-means é um exemplo clássico de aprendizagem:", "o": ["Preditiva.", "Descritiva (clusterização).", "Por reforço.", "Semi-supervisionada."], "a": 1}, {"id": 60, "t": 6, "q": "Descobrir que \"clientes que compram o produto X também compram o produto Y\" é uma tarefa:", "o": ["Preditiva (regressão).", "Descritiva (regras de associação).", "Preditiva (classificação).", "Por reforço."], "a": 1}, {"id": 61, "t": 6, "q": "Sobre o K-means, é correto afirmar que:", "o": ["O número de grupos k é descoberto automaticamente pelo algoritmo.", "Ele é imune à escolha da inicialização dos centróides.", "O número de grupos k é definido a priori, e o algoritmo pode convergir para um ótimo local.", "Ele exige dados rotulados para funcionar."], "a": 2}, {"id": 62, "t": 6, "q": "Um banco usa um modelo para estimar a probabilidade de um cliente não pagar o empréstimo com base no histórico dele. Essa é uma tarefa:", "o": ["Descritiva.", "Preditiva (classificação).", "Descritiva (sumarização).", "De associação."], "a": 1}, {"id": 63, "t": 6, "q": "A principal diferença conceitual entre aprendizagem descritiva e preditiva é:", "o": ["A linguagem de programação usada.", "O tamanho do conjunto de dados.", "O objetivo: entender os dados (descrever) versus estimar o desconhecido (prever).", "O tipo de banco de dados."], "a": 2}, {"id": 64, "t": 6, "q": "Em uma comparação, a avaliação de um modelo preditivo normalmente é feita por:", "o": ["Inspeção visual dos grupos formados.", "Comparação das previsões com os valores reais (acurácia, erro).", "Número de atributos do modelo.", "Tempo de execução apenas."], "a": 1}, {"id": 65, "t": 6, "q": "(Desafio) Um analista roda o K-means duas vezes sobre os mesmos dados e obtém agrupamentos diferentes. A explicação mais provável é:", "o": ["O K-means não converge nunca.", "A inicialização aleatória dos centróides leva o algoritmo a ótimos locais diferentes.", "Os dados continham rótulos.", "O K-means é um algoritmo determinístico em qualquer situação."], "a": 1}, {"id": 66, "t": 6, "q": "(Desafio) Um modelo de regressão linear é treinado para prever vendas, mas o analista usa os coeficientes aprendidos para entender o impacto de cada variável nas vendas. Esse uso configura:", "o": ["Um erro grave, pois regressão nunca é descritiva.", "Aplicação preditiva apenas.", "Um uso descritivo de um modelo tipicamente preditivo — a fronteira entre as duas categorias é fluida.", "Aprendizado por reforço."], "a": 2}, {"id": 67, "t": 7, "q": "A expressão \"Garbage in, garbage out\" (GIGO) em ML significa:", "o": ["A qualidade do modelo depende diretamente da qualidade dos dados.", "Modelos ruins devem ser descartados antes do treino.", "Dados numéricos são sempre melhores que categóricos.", "O algoritmo deve ser mais complexo que os dados."], "a": 0}, {"id": 68, "t": 7, "q": "Em projetos reais de aprendizado de máquina, a etapa que tipicamente consome mais tempo é:", "o": ["A escolha do algoritmo.", "A preparação/limpeza dos dados.", "A implantação do modelo.", "A escrita do relatório final."], "a": 1}, {"id": 69, "t": 7, "q": "A técnica mais comum para tratar dados numéricos faltantes é:", "o": ["Preencher com a média ou mediana da coluna (imputação).", "Substituir por zero em todos os casos.", "Ignorar o problema e treinar o modelo normalmente.", "Duplicar a linha anterior."], "a": 0}, {"id": 70, "t": 7, "q": "A normalização Min-Max transforma os dados para o intervalo:", "o": ["Média 0 e desvio padrão 1.", "-1 a 1.", "0 a 1.", "0 a 100."], "a": 2}, {"id": 71, "t": 7, "q": "A padronização (Z-score) transforma os dados para terem:", "o": ["Mínimo 0 e máximo 1.", "Média 0 e desvio padrão 1.", "Mediana 0 e amplitude 1.", "Soma total igual a 1."], "a": 1}, {"id": 72, "t": 7, "q": "Qual destes algoritmos NÃO é afetado pela escala das variáveis (dispensa normalização)?", "o": ["K-vizinhos (KNN).", "Máquinas de vetores de suporte (SVM).", "Redes neurais.", "Árvores de decisão."], "a": 3}, {"id": 73, "t": 7, "q": "O one-hot encoding é recomendado para variáveis categóricas porque:", "o": ["Cria uma ordem numérica entre as categorias.", "Ocupa menos memória que o label encoding.", "Cria uma coluna binária por categoria, sem impor ordem artificial.", "Transforma categorias diretamente em valores contínuos."], "a": 2}, {"id": 74, "t": 7, "q": "É adequado REMOVER linhas com dados faltantes quando:", "o": ["A coluna inteira da variável está faltando.", "A quantidade de linhas afetadas é pequena em relação ao total.", "A variável é categórica.", "O modelo é uma árvore de decisão."], "a": 1}, {"id": 75, "t": 7, "q": "O \"vazamento de dados\" (data leakage) ocorre quando:", "o": ["Informações do conjunto de teste influenciam o treinamento do modelo.", "O modelo é treinado por tempo demais.", "O conjunto de treino é pequeno demais.", "As variáveis são todas categóricas."], "a": 0}, {"id": 76, "t": 7, "q": "Ao normalizar/padronizar, o procedimento correto para evitar vazamento é:", "o": ["Calcular os parâmetros usando treino e teste juntos.", "Padronizar apenas o conjunto de teste.", "Não padronizar nenhum conjunto.", "Calcular os parâmetros apenas no treino e aplicá-los ao teste."], "a": 3}, {"id": 77, "t": 8, "q": "O algoritmo K-vizinhos mais próximos (KNN) é classificado como:", "o": ["Paramétrico e ansioso.", "Preguiçoso (lazy) e não paramétrico.", "Não paramétrico e ansioso.", "Paramétrico e preguiçoso."], "a": 1}, {"id": 78, "t": 8, "q": "Apesar do nome, a regressão logística é um algoritmo de:", "o": ["Regressão para valores contínuos.", "Classificação, que estima a probabilidade de pertencer a uma classe.", "Clusterização.", "Redução de dimensionalidade."], "a": 1}, {"id": 79, "t": 8, "q": "A principal vantagem das árvores de decisão em relação a KNN e SVM é:", "o": ["Não precisam de dados.", "São interpretáveis e não exigem normalização.", "Sempre atingem 100% de acurácia.", "Não sofrem overfitting nunca."], "a": 1}, {"id": 80, "t": 8, "q": "As Máquinas de Vetores de Suporte (SVM) buscam o hiperplano que:", "o": ["Minimiza o número de atributos.", "Maximiza a margem entre as classes.", "Minimiza a variância dos dados.", "Maximiza o número de vetores de suporte."], "a": 1}, {"id": 81, "t": 8, "q": "A função sigmoide é central no funcionamento de qual algoritmo?", "o": ["Árvore de decisão.", "Regressão logística.", "KNN.", "K-means."], "a": 1}, {"id": 82, "t": 8, "q": "Qual destes algoritmos é o mais indicado quando se precisa de um modelo explicável (interpretável) para justificar decisões?", "o": ["Rede neural profunda.", "SVM com kernel RBF.", "Árvore de decisão.", "KNN com muitos vizinhos."], "a": 2}, {"id": 83, "t": 8, "q": "O parâmetro k no KNN representa:", "o": ["O número de camadas do modelo.", "O número de vizinhos considerados na decisão.", "O número de atributos.", "A taxa de aprendizado."], "a": 1}, {"id": 84, "t": 8, "q": "Para separar dados não linearmente separáveis, a SVM utiliza:", "o": ["Funções de ativação.", "Kernels (ex.: RBF), que mapeiam os dados para um espaço de maior dimensão.", "Imputação de dados.", "Normalização obrigatória."], "a": 1}, {"id": 85, "t": 8, "q": "A principal limitação das redes neurais profundas em relação a outros algoritmos é:", "o": ["Não conseguem classificar dados.", "Exigem muitos dados e alto poder computacional, além de serem pouco interpretáveis.", "Não precisam de dados rotulados.", "Só funcionam com texto."], "a": 1}, {"id": 86, "t": 8, "q": "Ao comparar vários algoritmos sobre o mesmo problema (como no projeto), o objetivo é:", "o": ["Provar que a rede neural é sempre a melhor.", "Escolher o algoritmo que melhor se adequa ao problema, já que não existe um universalmente superior (No Free Lunch).", "Eliminar a necessidade de preparação de dados.", "Evitar o uso de validação."], "a": 1}, {"id": 87, "t": 9, "q": "A linguagem de programação mais utilizada em Aprendizado de Máquina, e que embasa toda a bibliografia do edital, é:", "o": ["Java.", "Python.", "C++.", "JavaScript."], "a": 1}, {"id": 88, "t": 9, "q": "A biblioteca NumPy é utilizada principalmente para:", "o": ["Criação de gráficos e visualizações.", "Computação numérica com arrays multidimensionais e operações eficientes.", "Treinamento de redes neurais profundas.", "Manipulação de tabelas e dados estruturados."], "a": 1}, {"id": 89, "t": 9, "q": "A biblioteca Pandas é utilizada principalmente para:", "o": ["Cálculos numéricos com arrays.", "Manipulação e análise de dados em tabelas (DataFrames).", "Criação de modelos de deep learning.", "Geração de gráficos estatísticos."], "a": 1}, {"id": 90, "t": 9, "q": "O objeto principal do Pandas para representar dados tabulares (linhas e colunas) é o:", "o": ["Array.", "DataFrame.", "Tensor.", "Vetor de suporte."], "a": 1}, {"id": 91, "t": 9, "q": "A biblioteca Scikit-learn é conhecida por fornecer:", "o": ["Apenas visualização de dados.", "Algoritmos de aprendizado de máquina prontos (classificação, regressão, clusterização).", "Apenas manipulação de strings.", "Compilação de código Python."], "a": 1}, {"id": 92, "t": 9, "q": "A principal vantagem do NumPy sobre listas comuns do Python é:", "o": ["A sintaxe mais curta.", "A eficiência e a operação vetorizada sobre arrays.", "A possibilidade de armazenar texto.", "A ausência de necessidade de importação."], "a": 1}, {"id": 93, "t": 9, "q": "Em um DataFrame do Pandas, a operação que agrupa os dados por uma categoria e calcula uma estatística (ex.: média) é:", "o": ["head()", "groupby()", "describe()", "drop_duplicates()"], "a": 1}, {"id": 94, "t": 9, "q": "Para treinamento de redes neurais profundas, as bibliotecas mais utilizadas são:", "o": ["NumPy e Pandas.", "TensorFlow e PyTorch.", "Matplotlib e Seaborn.", "Scikit-learn e SciPy."], "a": 1}, {"id": 95, "t": 9, "q": "No fluxo típico de um projeto de ML em Python, a ordem correta é:", "o": ["Treinar → carregar dados → limpar → avaliar.", "Carregar dados → limpar/preparar → treinar → avaliar.", "Avaliar → treinar → carregar → limpar.", "Limpar → avaliar → treinar → carregar."], "a": 1}, {"id": 96, "t": 9, "q": "A biblioteca Matplotlib é utilizada principalmente para:", "o": ["Computação numérica.", "Criação de gráficos e visualizações.", "Manipulação de tabelas.", "Treinamento de modelos de ML."], "a": 1}, {"id": 97, "t": 10, "q": "Na matriz de confusão, um Falso Positivo (FP) ocorre quando:", "o": ["O modelo prevê positivo e o real é positivo.", "O modelo prevê positivo, mas o real é negativo.", "O modelo prevê negativo, mas o real é positivo.", "O modelo prevê negativo e o real é negativo."], "a": 1}, {"id": 98, "t": 10, "q": "A precisão (precision) é definida como:", "o": ["VP / (VP + FN)", "VP / (VP + FP)", "(VP + VN) / total", "VN / (VN + FP)"], "a": 1}, {"id": 99, "t": 10, "q": "O recall (sensibilidade) é definido como:", "o": ["VP / (VP + FP)", "VP / (VP + FN)", "(VP + VN) / total", "2·P·R / (P + R)"], "a": 1}, {"id": 100, "t": 10, "q": "Em um problema com classes desbalanceadas (ex.: 99% negativos), a acurácia é considerada enganosa porque:", "o": ["Ela é sempre menor que 50%.", "Um modelo que prevê sempre a classe majoritária teria alta acurácia, mas seria inútil para detectar a classe rara.", "Ela não pode ser calculada.", "Ela só funciona para regressão."], "a": 1}, {"id": 101, "t": 10, "q": "O F1-Score é:", "o": ["A média aritmética de precisão e recall.", "A média harmônica entre precisão e recall.", "O produto de precisão e recall.", "A diferença entre precisão e recall."], "a": 1}, {"id": 102, "t": 10, "q": "Uma AUC = 0,5 na curva ROC indica que o modelo:", "o": ["É perfeito.", "Não é melhor que um classificador aleatório.", "Tem precisão de 100%.", "Tem recall de 100%."], "a": 1}, {"id": 103, "t": 10, "q": "Para avaliar um problema de regressão, as métricas mais adequadas são:", "o": ["Precisão e recall.", "MSE, MAE e R².", "Matriz de confusão e F1.", "Curva ROC e AUC."], "a": 1}, {"id": 104, "t": 10, "q": "Em um sistema de detecção de fraude, é mais crítico ter alto recall, pois:", "o": ["Queremos evitar marcar clientes honestos como fraudulentos.", "Queremos capturar o maior número possível de fraudes reais, mesmo que com alguns falsos positivos.", "A precisão é irrelevante.", "O recall é sempre 100%."], "a": 1}, {"id": 105, "t": 10, "q": "A validação cruzada (cross-validation) é preferível a uma única divisão treino/teste porque:", "o": ["É mais rápida de executar.", "Usa os dados de forma mais robusta, treinando e testando em várias partições.", "Elimina a necessidade de preparação de dados.", "Sempre aumenta a acurácia."], "a": 1}, {"id": 106, "t": 10, "q": "Em um filtro de spam, é mais importante ter alta precisão, pois:", "o": ["Queremos detectar todos os spams, mesmo errando.", "Queremos evitar classificar e-mails importantes como spam (falsos positivos).", "A precisão é a única métrica válida.", "O recall não se aplica a spam."], "a": 1}], "names": ["Fundamentos de ML", "Redes Neurais", "Teorema de Bayes e Naive Bayes", "Tipos de Aprendizado", "Aplicações de ML", "Viés Indutivo", "Aprendizagem Descritiva x Preditiva", "Preparação de Dados", "Algoritmos Clássicos", "Python e Bibliotecas", "Avaliação de Modelos"]};const Q=D.q,N=D.names;
const K="simuladoML_v1";
let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function st(id){return S[id]||(S[id]={r:0,w:0,l:null,f:0,s:0})}
const $=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let R=null,timer=null;
const isMissed=id=>{const x=S[id];return x&&x.w>0&&x.s<2};   // errada e ainda não dominada (2 acertos seguidos)
const pct=(a,b)=>b?Math.round(100*a/b):0;

function home(){
  clearInterval(timer);R=null;
  const seen=Q.filter(q=>S[q.id]&&S[q.id].r+S[q.id].w>0);
  const R_=Q.reduce((a,q)=>a+(S[q.id]?S[q.id].r:0),0),W_=Q.reduce((a,q)=>a+(S[q.id]?S[q.id].w:0),0);
  const missed=Q.filter(q=>isMissed(q.id)),unseen=Q.filter(q=>!S[q.id]||S[q.id].r+S[q.id].w==0),flag=Q.filter(q=>S[q.id]&&S[q.id].f);
  const mastered=Q.filter(q=>S[q.id]&&S[q.id].w>0&&S[q.id].s>=2).length;
  $.innerHTML=`<div class="row"><div><h1>📘 Simulado ML</h1><div class="mu">Concurso de Professor · Aprendizado de Máquina</div></div><button class="link" onclick="theme()">◐</button></div>
  <div class="card grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${Q.length}</b><span class="mu">questões</span></div><div class="stat"><b>${seen.length}</b><span class="mu">vistas</span></div><div class="stat"><b>${pct(R_,R_+W_)}%</b><span class="mu">acertos</span></div><div class="stat"><b>${missed.length}</b><span class="mu">a revisar</span></div></div>
  <h2>Modos de treino</h2><div class="grid">
  <button class="mode" onclick="start('missed')" ${missed.length?"":"disabled"}><b>🎯 Minhas falhas</b><span>${missed.length} questões (mais erradas primeiro)</span></button>
  <button class="mode" onclick="start('unseen')" ${unseen.length?"":"disabled"}><b>🆕 Ainda não vistas</b><span>${unseen.length} questões</span></button>
  <button class="mode" onclick="start('random')"><b>🔀 Aleatório</b><span>20 questões misturadas</span></button>
  <button class="mode" onclick="start('exam')"><b>⏱️ Simulado</b><span>30 questões, 60 min, gabarito no fim</span></button>
  <button class="mode" onclick="start('flag')" ${flag.length?"":"disabled"}><b>🔖 Marcadas</b><span>${flag.length} questões</span></button>
  <button class="mode" onclick="start('all')"><b>📚 Todas em ordem</b><span>${Q.length} questões</span></button></div>
  <h2>Treinar por tópico</h2>${N.map((n,i)=>{const qs=Q.filter(q=>q.t==i);const c=qs.reduce((a,q)=>a+(S[q.id]?S[q.id].r:0),0),w=qs.reduce((a,q)=>a+(S[q.id]?S[q.id].w:0),0);const m=qs.filter(q=>isMissed(q.id)).length;
  return `<button class="mode" style="width:100%;margin:6px 0" onclick="start('topic',${i})"><div class="row"><b>${esc(n)}</b><span>${qs.length} q${m?` · <b style="display:inline;color:var(--er)">${m} a revisar</b>`:""}</span></div><div class="bar"><i style="width:${pct(c,c+w)}%"></i></div><span>${c+w?pct(c,c+w)+"% de acerto":"não iniciado"}</span></button>`}).join("")}
  <h2>Progresso</h2><div class="card"><div class="mu">Questões já recuperadas (erradas e depois acertadas 2x seguidas): <b>${mastered}</b></div>
  <div class="grid" style="margin-top:10px"><button class="btn sec" onclick="backup()">Backup / restaurar</button><button class="btn sec" onclick="if(confirm('Apagar todo o histórico?')){S={};save();home()}">Zerar progresso</button></div></div>`;
}
function theme(){const r=document.documentElement,c=r.dataset.theme;r.dataset.theme=c=="dark"?"light":"dark"}
function backup(){
  $.innerHTML=`<div class="top"><button class="link" onclick="home()">← Voltar</button></div><h1>Backup</h1><p class="mu">Copie o texto abaixo para guardar seu progresso. Para restaurar, cole aqui e toque em Restaurar.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div class="grid" style="margin-top:10px"><button class="btn sec" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('bk').value)">Copiar</button><button class="btn" onclick="try{S=JSON.parse(document.getElementById('bk').value);save();home()}catch(e){alert('Texto inválido')}">Restaurar</button></div>`}

function start(mode,t){
  let ids;
  if(mode=="topic")ids=shuffle(Q.filter(q=>q.t==t).map(q=>q.id));
  else if(mode=="missed")ids=Q.filter(q=>isMissed(q.id)).sort((a,b)=>S[b.id].w-S[a.id].w||Math.random()-.5).map(q=>q.id);
  else if(mode=="unseen")ids=shuffle(Q.filter(q=>!S[q.id]||S[q.id].r+S[q.id].w==0).map(q=>q.id)).slice(0,20);
  else if(mode=="flag")ids=shuffle(Q.filter(q=>S[q.id]&&S[q.id].f).map(q=>q.id));
  else if(mode=="random")ids=shuffle(Q.map(q=>q.id)).slice(0,20);
  else if(mode=="exam")ids=shuffle(Q.map(q=>q.id)).slice(0,30);
  else ids=Q.map(q=>q.id);
  R={mode,t,ids,i:0,ans:{},ordem:{},exam:mode=="exam",end:Date.now()+3600e3};
  prepararAlternativas();
  if(R.exam){clearInterval(timer);timer=setInterval(tick,1000)}
  quiz();
}
function prepararAlternativas(){
  // Sorteia a ordem uma única vez por questão nesta tentativa.
  // Assim, ao voltar para uma questão, as alternativas permanecem iguais.
  R.ids.forEach(id=>{
    R.ordem[id]=shuffle(Q[id].o.map((_,i)=>i));
  });
}
function indiceCorreto(id){
  return R.ordem[id].indexOf(Q[id].a);
}
function tick(){const e=document.getElementById("tm");if(!R||!R.exam){clearInterval(timer);return}const s=Math.max(0,(R.end-Date.now())/1000|0);if(e)e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0)finish()}
function quiz(){
  const id=R.ids[R.i],q=Q[id],a=R.ans[id],done=a!==undefined&&!R.exam,x=st(id);
  const title=R.mode=="topic"?N[R.t]:{missed:"Minhas falhas",unseen:"Não vistas",flag:"Marcadas",random:"Aleatório",exam:"Simulado",all:"Todas"}[R.mode];
  $.innerHTML=`<div class="top"><div class="row"><button class="link" onclick="if(confirm('Sair deste treino?'))home()">← Sair</button><span class="mu">${esc(title)} · ${R.i+1}/${R.ids.length}</span>${R.exam?'<b id="tm"></b>':`<button class="link" onclick="flag(${id})">${x.f?"🔖":"🏷️"}</button>`}</div><div class="bar"><i style="width:${(R.i+(done?1:0))/R.ids.length*100}%;background:var(--pr)"></i></div></div>
  <span class="tag">${esc(N[q.t])}</span>${x.w?` <span class="tag">errou ${x.w}x</span>`:""}
  <div class="q">${esc(q.q)}</div>
  ${R.ordem[id].map((original,i)=>{const o=q.o[original],correto=indiceCorreto(id);let c="opt";if(done){if(i==correto)c+=" ok";else if(i==a)c+=" er"}else if(i==a)c+=" sel";return `<button class="${c}" onclick="pick(${id},${i})"><b>${"abcd"[i]})</b> ${esc(o)}</button>`}).join("")}
  ${done?`<div class="fb ${a==indiceCorreto(id)?"ok":"er"}">${a==indiceCorreto(id)?"✔ Correto!":"✘ Errado. Resposta certa: "+"abcd"[indiceCorreto(id)]+")"}</div>`:""}
  <div class="grid" style="margin-top:14px"><button class="btn sec" onclick="nav(-1)" ${R.i?"":"disabled"}>← Anterior</button>
  ${R.i<R.ids.length-1?`<button class="btn" onclick="nav(1)">Próxima →</button>`:`<button class="btn" onclick="finish()">Finalizar</button>`}</div>`;
  if(R.exam)tick();
}
function nav(d){R.i+=d;quiz();scrollTo(0,0)}
function flag(id){const x=st(id);x.f=x.f?0:1;save();quiz()}
function pick(id,i){
  if(R.ans[id]!==undefined&&!R.exam)return;
  R.ans[id]=i;
  if(!R.exam)record(id,i);
  quiz();
}
function record(id,i){const x=st(id),ok=R.ordem[id][i]===Q[id].a;if(ok){x.r++;x.s++}else{x.w++;x.s=0}x.l=ok;save()}
function finish(){
  clearInterval(timer);
  if(R.exam)R.ids.forEach(id=>{if(R.ans[id]!==undefined)record(id,R.ans[id])});
  const tot=R.ids.length,ok=R.ids.filter(id=>R.ans[id]!==undefined&&R.ordem[id][R.ans[id]]===Q[id].a).length,un=R.ids.filter(id=>R.ans[id]===undefined).length;
  const wrong=R.ids.filter(id=>R.ans[id]!==undefined&&R.ordem[id][R.ans[id]]!==Q[id].a);
  $.innerHTML=`<h1>Resultado</h1><div class="card stat"><b style="font-size:40px">${pct(ok,tot)}%</b><div class="mu">${ok} de ${tot} corretas${un?` · ${un} sem resposta`:""}</div></div>
  ${wrong.length?`<h2>Para revisar (${wrong.length})</h2>`+wrong.map(id=>{const q=Q[id],marcada=R.ordem[id][R.ans[id]],correta=q.a;return `<div class="card"><div class="mu">${esc(N[q.t])}</div><div style="font-weight:600;margin:4px 0">${esc(q.q)}</div><div style="color:var(--er)">Sua resposta: ${"abcd"[R.ans[id]]}) ${esc(q.o[marcada])}</div><div style="color:var(--ok)">Correta: ${"abcd"[indiceCorreto(id)]}) ${esc(q.o[correta])}</div></div>`}).join(""):`<div class="card">Nenhum erro. 🎉</div>`}
  ${un?`<h2>Sem resposta (${un})</h2><div class="mu">Elas não contam como erro. Veja no modo “Ainda não vistas”.</div>`:""}
  <div class="grid" style="margin-top:14px"><button class="btn sec" onclick="home()">Início</button>${wrong.length?`<button class="btn" onclick="redo()">Refazer erradas</button>`:`<button class="btn" onclick="home()">Concluir</button>`}</div>`;
  R.wrong=wrong;
}
function redo(){const w=R.wrong;R={mode:"missed",ids:shuffle(w),i:0,ans:{},ordem:{},exam:false};prepararAlternativas();quiz();scrollTo(0,0)}
home();
</script></body></html>
